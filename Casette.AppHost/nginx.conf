events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 10G;

    server {
        listen 80;
        resolver 127.0.0.11 valid=30s;

        # Serve Angular static files with SPA fallback
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # API - strip /api/ prefix and forward to backend
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Video streaming - client facing
        location /v/ {
            auth_request /auth/verify-stream;
            auth_request_set $object_key $upstream_http_x_object_key;
            auth_request_set $accel_redirect $upstream_http_x_accel_redirect;
    
            set $minio_url http://minio:9000/casette-videos/$object_key;
    
            proxy_pass http://minio:9000$accel_redirect;
    
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Range $http_range;
            proxy_set_header Host minio:9000;
            proxy_set_header Authorization "";
        }

        # Internal auth subrequest - client can never call this directly
        location /auth/verify-stream {
            internal;
            proxy_pass http://backend:8080/auth/verify-stream;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}